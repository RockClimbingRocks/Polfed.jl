<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"
     aria-labelledby="title description">
  <title id="title">POLFED spectral transformation</title>
  <desc id="description">
    A polynomial filter maps eigenvalues near a requested energy to an extreme
    of the transformed spectrum, where a Krylov eigensolver can reach them.
  </desc>
  <style>
    .axis { fill: none; stroke: #f3f4f6; stroke-width: 4; stroke-linecap: round; }
    .curve { fill: none; stroke: #82aaf0; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .ordinary { fill: #ffc266; fill-opacity: .42; stroke: #ffad33; stroke-width: 3; }
    .wanted { fill: #ff7a85; fill-opacity: .58; stroke: #ff4d5d; stroke-width: 4; }
    .tick { stroke: #ffad33; stroke-width: 3; }
    .target-tick { stroke: #ff5c68; stroke-width: 4; }
    text { fill: #f3f4f6; font-family: Inter, system-ui, sans-serif; }
  </style>

  <line class="axis" x1="55" y1="350" x2="1145" y2="350"/>
  <path class="curve" d="
    M 70 432
    C 98 386, 126 478, 154 430
    S 210 386, 238 438
    S 294 482, 322 424
    S 378 372, 406 446
    S 462 526, 500 432
    C 536 342, 550 475, 570 505
    C 582 465, 588 280, 596 132
    C 598 88, 600 58, 602 42
    C 604 58, 606 88, 608 132
    C 616 280, 622 465, 634 505
    C 654 475, 668 342, 704 432
    S 760 526, 788 446
    S 844 372, 872 424
    S 928 482, 956 438
    S 1012 386, 1040 430
    S 1096 478, 1124 432"/>

  <g class="ordinary">
    <circle cx="88" cy="414" r="11"/><circle cx="138" cy="443" r="11"/>
    <circle cx="190" cy="410" r="11"/><circle cx="246" cy="444" r="11"/>
    <circle cx="304" cy="438" r="11"/><circle cx="356" cy="400" r="11"/>
    <circle cx="412" cy="462" r="11"/><circle cx="460" cy="487" r="11"/>
    <circle cx="505" cy="422" r="11"/><circle cx="540" cy="420" r="11"/>
    <circle cx="560" cy="487" r="11"/><circle cx="644" cy="487" r="11"/>
    <circle cx="664" cy="420" r="11"/><circle cx="700" cy="422" r="11"/>
    <circle cx="744" cy="487" r="11"/><circle cx="792" cy="462" r="11"/>
    <circle cx="848" cy="400" r="11"/><circle cx="900" cy="438" r="11"/>
    <circle cx="958" cy="444" r="11"/><circle cx="1014" cy="410" r="11"/>
    <circle cx="1066" cy="443" r="11"/><circle cx="1116" cy="414" r="11"/>
  </g>

  <g class="wanted">
    <circle cx="576" cy="390" r="12"/><circle cx="581" cy="332" r="12"/>
    <circle cx="585" cy="274" r="12"/><circle cx="590" cy="210" r="12"/>
    <circle cx="594" cy="148" r="12"/><circle cx="598" cy="91" r="12"/>
    <circle cx="603" cy="64" r="12"/><circle cx="607" cy="112" r="12"/>
    <circle cx="611" cy="174" r="12"/><circle cx="616" cy="236" r="12"/>
    <circle cx="621" cy="300" r="12"/><circle cx="627" cy="362" r="12"/>
  </g>

  <path class="axis" d="M 720 62 h 18 q 22 0 22 22 v 90 q 0 18 16 32
                              q -16 14 -16 32 v 90 q 0 22 -22 22 h -18"/>
  <text x="800" y="185" font-size="34" font-weight="650">filtered target</text>
  <text x="800" y="224" font-size="24">extremal eigenvalues</text>

  <line class="axis" x1="55" y1="625" x2="1145" y2="625"/>
  <g class="tick">
    <path d="M80 620v-53 M128 620v-36 M166 620v-49 M205 620v-31
             M242 620v-43 M274 620v-28 M304 620v-51 M332 620v-35
             M360 620v-46 M386 620v-30 M412 620v-55 M438 620v-38
             M462 620v-47 M486 620v-29 M510 620v-50 M532 620v-34
             M552 620v-45 M653 620v-39 M676 620v-51 M700 620v-31
             M724 620v-47 M750 620v-36 M778 620v-54 M808 620v-32
             M840 620v-45 M874 620v-30 M910 620v-52 M950 620v-36
             M992 620v-48 M1038 620v-31 M1086 620v-50 M1120 620v-34"/>
  </g>
  <g class="target-tick">
    <path d="M562 620v-55 M571 620v-40 M580 620v-61 M589 620v-47
             M598 620v-65 M607 620v-43 M616 620v-58 M625 620v-38
             M634 620v-52 M643 620v-44"/>
  </g>
  <line class="axis" x1="602" y1="610" x2="602" y2="648"/>
  <text x="586" y="690" font-family="serif" font-size="52">λ</text>
  <text x="945" y="680" font-size="27">original spectrum</text>
</svg>
